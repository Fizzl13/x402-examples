    facts: { budget_usd: 0.02, tolerance: 0.5, documented_pay_to: "0xa0B1c2D3e4F5a6B7c8D9e0F1a2B3c4D5e6F7a8B9", documented_host: api.searchly.example, host: api.searchly.example, kind: x402, amount: "10000", asset: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913", pay_to: "0xa0B1c2D3e4F5a6B7c8D9e0F1a2B3c4D5e6F7a8B9", doctor_verdict: go }

