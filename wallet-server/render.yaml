services:
  - type: web
    name: fizzl-wallet-server
    runtime: node
    rootDir: wallet-server
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: SENTRY_DSN # optional: errors (5xx, crashes) to Sentry, without request data (src/error-report.js)
        sync: false
      - key: WALLET_REDIS_URL
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: PASS_SIGNING_KEY
        sync: false
      - key: PASS_SALE_KEY
        sync: false
      - key: ONRAMP_KEY # the same long random value as on x402 Doctor: buy USDC with a card (src/onramp.js)
        sync: false
      - key: MANDATE_SECRET
        sync: false
      - key: PG1_API_KEY
        sync: false
