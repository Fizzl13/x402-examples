<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Swap | Fizzl Agent Wallet</title>
<meta name="robots" content="noindex">
<style>
@font-face { font-family: "Lexend"; font-style: normal; font-weight: 100 900; font-display: swap; src: url("/fonts/lexend-latin-wght-normal.woff2") format("woff2"); }
@font-face { font-family: "Unbounded"; font-style: normal; font-weight: 400; font-display: swap; src: url("/fonts/unbounded-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Unbounded"; font-style: normal; font-weight: 500; font-display: swap; src: url("/fonts/unbounded-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "Unbounded"; font-style: normal; font-weight: 600; font-display: swap; src: url("/fonts/unbounded-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "Unbounded"; font-style: normal; font-weight: 700; font-display: swap; src: url("/fonts/unbounded-latin-700-normal.woff2") format("woff2"); }
@font-face { font-family: "Unbounded"; font-style: normal; font-weight: 800; font-display: swap; src: url("/fonts/unbounded-latin-800-normal.woff2") format("woff2"); }
@font-face { font-family: "Unbounded"; font-style: normal; font-weight: 900; font-display: swap; src: url("/fonts/unbounded-latin-900-normal.woff2") format("woff2"); }
:root { --bg: #020708; --mint: #61f5c3; --text: #f4f8f7; --soft: #d1dbd9; --muted: #a8b5b2; --dim: #82918f; --line: rgba(97,245,195,.28); color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--soft); font: 400 16px/1.65 "Lexend", Arial, sans-serif; }
.wrap { width: min(780px, calc(100% - 32px)); margin-inline: auto; }
header { border-bottom: 1px solid var(--line); }
header .wrap { height: 64px; display: flex; align-items: center; justify-content: space-between; }
.brand { font: 700 22px/1 "Unbounded", Arial, sans-serif; letter-spacing: -1.2px; color: var(--text); text-decoration: none; }
.brand span { color: var(--mint); }
main { padding: 40px 0 64px; }
h1 { font: 700 clamp(34px, 6vw, 52px)/1 "Unbounded", Arial, sans-serif; letter-spacing: -2px; text-transform: uppercase; color: var(--text); margin: 0 0 10px; }
h2 { font: 700 20px/1.25 "Unbounded", Arial, sans-serif; color: var(--text); margin: 36px 0 10px; }
p, li { color: var(--soft); }
.note { color: var(--dim); font-size: 13px; }
a { color: var(--mint); }
mark { background: rgba(245,195,97,.18); color: #f5c361; padding: 0 4px; border-radius: 4px; }
.table { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; min-width: 560px; }
th, td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid rgba(97,245,195,.12); }
th { color: var(--mint); font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 600; }
tr:last-child td { border-bottom: 0; }
ul { padding-left: 20px; }
footer { border-top: 1px solid var(--line); padding: 22px 0 36px; color: var(--dim); font-size: 12px; }

.btn { display: inline-block; border: 1px solid var(--line); background: transparent; color: var(--text); font: 600 15px/1 "Lexend", Arial, sans-serif; padding: 13px 22px; border-radius: 999px; cursor: pointer; text-decoration: none; }
.btn.pri { background: var(--mint); border-color: var(--mint); color: #021; }
.btn:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 22px; }
.msg { margin-top: 16px; color: var(--text); }
h1 { text-transform: none; font-size: clamp(28px, 5vw, 40px); letter-spacing: -1px; }

.card { border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; margin: 18px 0; }
.card dl { display: grid; grid-template-columns: 120px 1fr; gap: 8px 14px; margin: 0; font-size: 14px; }
.card dt { color: var(--dim); } .card dd { margin: 0; color: var(--text); overflow-wrap: anywhere; }
.opt { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 14px; }
.opt p { margin: 0 0 10px; }
.qr { display: none; margin-top: 14px; border-radius: 12px; background: #fff; }
@media (min-width: 700px) and (hover: hover) { .qr { display: block; } }
.big { font: 700 34px/1.1 "Unbounded", Arial, sans-serif; color: var(--text); margin: 6px 0 2px; }
.warn { color: #f5c361; } .bad { color: #ff7a90; } .good { color: var(--mint); }
.pair { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; margin: 10px 0 14px; }
.tok { border: 1px solid rgba(97,245,195,.18); border-radius: 14px; padding: 10px 12px; }
.tok small { display: block; color: var(--dim); font-size: 12px; }
.tok b { font: 700 20px/1.2 "Unbounded", Arial, sans-serif; color: var(--text); overflow-wrap: anywhere; }
.arrow { color: var(--mint); font-size: 22px; }
.verdict { border-radius: 12px; padding: 10px 12px; margin-top: 12px; font-size: 14px; }
.verdict.green { background: rgba(97,245,195,.1); border: 1px solid rgba(97,245,195,.4); }
.verdict.orange { background: rgba(245,195,97,.1); border: 1px solid rgba(245,195,97,.4); }
</style>
</head>
<body>
<header><div class="wrap"><a class="brand" href="/">FIZZL<span>.WALLET</span></a></div></header>
<main class="wrap">
  <h1 id="title">Swap</h1>
  <div id="body"><p class="note">Loading…</p></div>
  <p id="msg" class="msg" role="status"></p>
</main>
<footer><div class="wrap">Fizzl Agent Wallet · never holds keys or funds · <a href="/terms">terms</a> · <a href="/privacy">privacy</a> · © 2026 Fizzl</div></footer>
<script>
(() => {
  // A swap an agent asked for: the owner's own wallet sends it. The transactions on this page are exactly the ones
  // presign-guard checked (its verdict is bound to them); the server compares what was sent with them afterwards.
  const id = location.pathname.split("/").pop();
  const $ = (x) => document.getElementById(x);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const short = (a) => `${String(a).slice(0, 6)}…${String(a).slice(-4)}`;
  const msg = (t, cls = "") => { $("msg").className = `msg ${cls}`; $("msg").textContent = t; };
  const api = async (method, path, body) => {
    const r = await fetch(path, { method, headers: body ? { "content-type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined });
    const j = await r.json().catch(() => ({}));
    return { status: r.status, ...j };
  };
  const hex = (n) => `0x${BigInt(n).toString(16)}`;
  let view = null, poll = null, timer = null;

  const TITLES = { waiting: "Swap?", approving: "Approving…", swapping: "Swapping…", done: "Swapped", failed: "Not swapped", changed: "Stopped: changed", denied: "Declined", expired: "Price expired" };

  function render(v) {
    clearTimeout(poll); clearInterval(timer);
    view = v;
    $("title").textContent = TITLES[v.status] ?? "Swap";
    const orange = (v.checks ?? []).some((c) => c.verdict !== "green");
    const reasons = (v.checks ?? []).flatMap((c) => (c.reasons ?? []).map((r) => `${c.kind}: ${r.message || r.code}`));
    const card = `<div class="card">
      <p style="margin:0"><b>${esc(v.agent)}</b> ${v.status === "done" ? "swapped" : "wants to swap"}${v.reason ? ` for “${esc(v.reason)}”` : ""}</p>
      <div class="pair"><div class="tok"><small>You pay</small><b>${esc(v.pay)}</b></div><div class="arrow">→</div><div class="tok"><small>You get at least</small><b>${esc(v.atLeast)}</b></div></div>
      <dl>
        <dt>Expected</dt><dd>${esc(v.expected)}</dd>
        <dt>Route</dt><dd>${esc(v.route)}</dd>
        <dt>Price slip</dt><dd>at most ${esc(v.slip)}</dd>
        <dt>Approval</dt><dd>${esc(v.approval)}</dd>
        <dt>Worth</dt><dd>about $${esc(v.usd)}</dd>
      </dl>
      <div class="verdict ${orange ? "orange" : "green"}">presign-guard: <b>${orange ? "orange" : "green"}</b> · bound to exactly ${v.checks?.length === 2 ? "these two transactions" : "this transaction"}${reasons.length ? `<br>${reasons.map(esc).join("<br>")}` : ""}</div>
    </div>`;
    if (v.status === "waiting" || v.status === "approving") {
      const left = () => Math.max(0, Math.round((Date.parse(v.expires_at) - Date.now()) / 1000));
      const needsApprove = v.txs.some((t) => t.kind === "approve" && !t.sent);
      const buttons = window.ethereum
        ? `<button class="btn pri" id="go" type="button">${needsApprove ? "1. Approve, 2. swap, with my wallet" : "Swap with my wallet"}</button>`
        : `<a class="btn pri" href="https://metamask.app.link/dapp/${esc(location.host + location.pathname)}">Open in MetaMask</a><a class="btn" href="https://go.cb-w.com/dapp?cb_url=${encodeURIComponent(location.href)}">Open in Coinbase Wallet</a>`;
      $("body").innerHTML = card + `<p>Nothing happens until your wallet sends it. ${needsApprove ? "First an approval of exactly this amount for Uniswap's router (never unlimited), then the swap: two transactions in your wallet." : "One transaction in your wallet."} Check the amounts in your wallet before you confirm.</p>
        ${orange ? '<p class="warn">presign-guard says orange: read the reasons above before you send it.</p>' : ""}
        <div class="row">${buttons}${v.status === "waiting" ? '<button class="btn" id="refresh" type="button">New price</button><button class="btn" id="deny" type="button">No</button>' : ""}</div>
        <p class="note" id="left"></p>`;
      const tick = () => { const s = left(); $("left").textContent = s > 0 ? `This price holds ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")} more.` : "This price expired: get a new one."; if ($("go")) $("go").disabled = s <= 0 && v.status === "waiting"; };
      tick(); timer = setInterval(tick, 1000);
      if ($("go")) $("go").onclick = go;
      if ($("refresh")) $("refresh").onclick = refresh;
      if ($("deny")) $("deny").onclick = deny;
      if (v.status === "approving") poll = setTimeout(load, 3000);
      return;
    }
    if (v.status === "swapping") { $("body").innerHTML = card + "<p>Your swap is on its way. This page updates when Base confirms it.</p>"; poll = setTimeout(load, 3000); return; }
    const tx = v.sent?.swap;
    const text = { done: '<p class="good">Swapped. The tokens are in your wallet.</p>', failed: `<p class="bad">${esc(v.note || "It didn't go through. Nothing was swapped.")}</p>`, changed: `<p class="bad">⚠️ ${esc(v.note || "What was sent is not what presign-guard checked.")} Check your wallet's activity.</p>`, denied: "<p>You said no. Nothing was swapped.</p>", expired: "<p>The price expired. Nothing was swapped. Ask your agent again for a fresh price.</p>" }[v.status] ?? "";
    $("body").innerHTML = card + text + (tx ? `<div class="row"><a class="btn" href="https://basescan.org/tx/${esc(tx)}" target="_blank" rel="noopener">The transaction</a></div>` : "");
  }

  async function load() {
    const v = await api("GET", `/connector/swaps/${encodeURIComponent(id)}`).catch(() => null);
    if (!v || v.status === 404 || !v.agent) { $("title").textContent = "Not found"; $("body").innerHTML = `<p>${esc(v?.message || "This swap request doesn't exist or has expired.")}</p>`; return; }
    render(v);
  }

  async function send(eth, me, t) {
    const hash = await eth.request({ method: "eth_sendTransaction", params: [{ from: me, to: t.tx.to, value: hex(t.tx.value), data: t.tx.data, chainId: hex(t.tx.chainId) }] });
    const r = await api("POST", `/connector/swaps/${encodeURIComponent(id)}/sent`, { kind: t.kind, hash });
    if (!r.agent) throw new Error(r.message || "The server didn't take the transaction.");
    return r;
  }
  async function go() {
    const eth = window.ethereum;
    for (const b of document.querySelectorAll("button")) b.disabled = true;
    try {
      const accounts = await eth.request({ method: "eth_requestAccounts" });
      const from = view.txs[0].tx.from;
      const me = accounts.find((a) => a.toLowerCase() === from.toLowerCase());
      if (!me) { msg(`Your wallet is on ${short(accounts[0] ?? "?")}. Switch to ${short(from)}, the address you sign in to Fizzl with, and try again.`, "warn"); return; }
      try { await eth.request({ method: "wallet_switchEthereumChain", params: [{ chainId: "0x2105" }] }); }
      catch (e) {
        if (e?.code !== 4902) throw e;
        await eth.request({ method: "wallet_addEthereumChain", params: [{ chainId: "0x2105", chainName: "Base", nativeCurrency: { name: "Ether", symbol: "ETH", decimals: 18 }, rpcUrls: ["https://mainnet.base.org"], blockExplorerUrls: ["https://basescan.org"] }] });
      }
      const approve = view.txs.find((t) => t.kind === "approve" && !t.sent);
      if (approve) {
        msg("Approve exactly this amount in your wallet…");
        const after = await send(eth, me, approve);
        msg("Waiting for Base to confirm the approval…");
        await waitReceipt(eth, after.sent?.approve);
      }
      const swap = view.txs.find((t) => t.kind === "swap");
      msg("Confirm the swap in your wallet…");
      const r = await send(eth, me, swap);
      msg("");
      render(r);
    } catch (e) {
      msg(e?.code === 4001 ? "You didn't confirm. Nothing more was sent; you can still send it or say no." : `Your wallet said: ${e?.message || e}`, "warn");
      load();
    } finally { for (const b of document.querySelectorAll("button")) b.disabled = false; }
  }
  // Wait until the wallet's own node has the approval in a block (so the swap can spend it).
  async function waitReceipt(eth, hash) {
    if (!hash) return;
    for (let i = 0; i < 90; i++) {
      const r = await eth.request({ method: "eth_getTransactionReceipt", params: [hash] }).catch(() => null);
      if (r) { if (r.status !== "0x1") throw new Error("The approval failed on Base. Nothing was swapped."); return; }
      await new Promise((ok) => setTimeout(ok, 2000));
    }
    throw new Error("The approval isn't confirmed yet. Reload this page in a minute and send the swap.");
  }
  async function refresh() {
    msg("Getting a new price and a new check…");
    const r = await api("POST", `/connector/swaps/${encodeURIComponent(id)}/refresh`);
    msg(r.agent ? "" : r.message || "That didn't work.", r.agent ? "" : "warn");
    render(r.agent ? r : r.view ?? view);
  }
  async function deny() { const r = await api("POST", `/connector/swaps/${encodeURIComponent(id)}/deny`); render(r.agent ? r : r.view ?? view); }
  load();
})();
</script>
</body>
</html>
