name: wallet-video

# The Fizzl Agent Wallet intro video: a neural voice (Kokoro, open weights)
# reads wallet-server/media/script.json, a real browser records the live demo
# (https://wallet.fizzl.eu/demo, example data) and the drawn safety scenes timed
# to the voice, ffmpeg mixes both into an MP4 with burned-in captions.
# Download the result from the run's artifact (fizzl-agent-wallet or fizzl-agent-wallet-30s).
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Which video: script.json (the ~90-second intro), short.json (30 seconds, for social media) or fizzl.json (the Fizzl ad, ~45 seconds)"
        type: choice
        options: [script.json, short.json, fizzl.json]
        default: script.json
      voice:
        description: "Kokoro voice (e.g. af_heart, af_bella, am_michael, bf_emma, bm_george)"
        required: false
        default: "af_heart"
      speed:
        description: "Speaking speed (1.0 = normal)"
        required: false
        default: "1.0"

permissions:
  contents: read

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: wallet-server/media
    env:
      SCRIPT: ${{ inputs.script || 'script.json' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - name: Voice (Kokoro)
        run: |
          pip install -q kokoro-onnx soundfile numpy
          curl -fsSL -o kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -fsSL -o voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          python tts.py --engine kokoro --voice "${{ inputs.voice || 'af_heart' }}" --speed "${{ inputs.speed || '1.0' }}"
      - name: Higgsfield clips (for scripts with clip scenes, from the media-clips branch)
        run: |
          grep -q '"scene": "clip"' "$SCRIPT" || exit 0
          command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
          mkdir -p clips
          git fetch --depth 1 origin media-clips
          for f in $(git ls-tree --name-only FETCH_HEAD | grep '\.mp4$'); do
            git show "FETCH_HEAD:$f" > "clips/$f"
            # Chromium (which records the video) plays VP9, not H.264.
            ffmpeg -loglevel error -y -i "clips/$f" -an -c:v libvpx-vp9 -b:v 6M -deadline good -cpu-used 4 "clips/${f%.mp4}.webm"
          done
          ls -la clips
      - name: Browser
        run: |
          npm i --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Record
        run: node record.js
      - name: Mix and encode
        run: |
          command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
          python build.py
      - name: Contact sheet (one frame per scene)
        run: |
          NAME=$(python -c "import json,os;print(json.load(open(os.environ['SCRIPT'])).get('output','fizzl-agent-wallet'))")
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          i=0
          for t in $(python -c "import json;t=json.load(open('out/timeline.json'));print(' '.join(str(round(s['start']+s['duration']*0.8,1)) for s in t['segments']))"); do
            ffmpeg -loglevel error -y -ss "$t" -i "out/$NAME.mp4" -frames:v 1 -update 1 -vf scale=640:-1 "out/f$i.jpg"; i=$((i+1))
          done
          ffmpeg -loglevel error -y -framerate 1 -i out/f%d.jpg -vf "tile=3x$(( (i + 2) / 3 ))" -frames:v 1 -update 1 out/contact.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: |
            wallet-server/media/out/${{ env.NAME }}.mp4
            wallet-server/media/out/${{ env.NAME }}.srt
            wallet-server/media/out/poster.jpg
            wallet-server/media/out/contact.jpg
