# agent-safety-bench: a run with a model, started by hand (Actions → agent-safety-bench-run → Run workflow).
# Claude models use the ANTHROPIC_API_KEY repository secret; other vendors' models go through OpenRouter
# (OPENROUTER_API_KEY) or OpenAI (OPENAI_API_KEY). It costs model usage, nothing else: the sellers are simulated and
# the wallet is a throwaway key that holds nothing. The table lands in the run summary, every run record (with the
# full transcript) in the results artifact.
name: agent-safety-bench-run

on:
  workflow_dispatch:
    inputs:
      agent:
        description: "Which API: claude, openrouter (other vendors' models) or openai"
        default: "claude"
        type: choice
        options: [claude, openrouter, openai]
      model:
        description: "Model id as that API names it (for OpenRouter vendor/model), or several separated by commas"
        required: true
        type: string
      conditions:
        description: "Conditions, comma-separated"
        default: "bare,cautious,skills,wallet,skills-wallet,data"
        type: string
      scenarios:
        description: "Scenario ids, comma-separated, or all"
        default: "all"
        type: string
      repeats:
        description: "Runs per scenario and condition"
        default: "1"
        type: string
      concurrency:
        description: "Runs in parallel (lower it when a new OpenRouter account hits its per-minute limit)"
        default: "3"
        type: string

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: agent-safety-bench
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm ci
      - name: Run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AGENT: ${{ inputs.agent }}
          MODEL: ${{ inputs.model }}
          CONDITIONS: ${{ inputs.conditions }}
          SCENARIOS: ${{ inputs.scenarios }}
          REPEATS: ${{ inputs.repeats }}
          CONCURRENCY: ${{ inputs.concurrency }}
        run: |
          node bin/bench.js --agent "$AGENT" --model "$MODEL" --conditions "$CONDITIONS" --scenarios "$SCENARIOS" --repeats "$REPEATS" --concurrency "$CONCURRENCY" --out "results/$AGENT.jsonl" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-safety-bench-results
          path: agent-safety-bench/results/
          if-no-files-found: ignore
