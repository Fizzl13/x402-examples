# Keeps the agent wallet server (wallet.fizzl.eu, Render free plan) awake: Render puts a free service to
# sleep after ~15 minutes without traffic, and agents ask it before every payment, so a cold start would
# make them wait about a minute. A health ping every 10 minutes (GitHub's schedule can run a little late).
# Note: Render's free plan has 750 hours a month for all free services together; keep only this one awake.
name: wallet-keep-alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the wallet server
        run: curl -sf -m 90 -o /dev/null -w "%{http_code} %{time_total}s\n" https://wallet.fizzl.eu/health
