# exam-agent: a model takes the Agent Benchmark Exam on exam.fizzl.eu as a real agent with an x402 wallet, and
# its signed result goes into the public index (Actions → exam-agent → Run workflow). Claude models use the
# ANTHROPIC_API_KEY repository secret; other vendors' models (Grok, GPT, …) go through OpenRouter (OPENROUTER_API_KEY)
# or OpenAI (OPENAI_API_KEY), open models (Llama, Qwen, DeepSeek, …) through Hugging Face's Inference Providers (HF_TOKEN). It costs model usage only: each run makes a fresh, empty operator wallet (whose first exam is
# free) and a fresh payment key; the exam's sellers take Base Sepolia test money and never settle it.
# With "doctor" the agent may ask x402 Doctor before paying; without it, it decides on the 402 alone. With "safe_fetch"
# its payments go through x402-safe-fetch's rules (preflight, budget, never paying twice for nothing). With
# "spend_limits" it has an ordinary harness and nothing from Fizzl: the task's budget, and only the sellers it names.
name: exam-agent

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "claude, openrouter (x-ai/grok-4.7, openai/gpt-6-luna, …), openai or huggingface (Qwen/…, meta-llama/…)"
        default: "claude"
        type: choice
        options: [claude, openrouter, openai, huggingface]
      model:
        description: "Model id as that API names it"
        default: "claude-haiku-5-5"
        type: string
      doctor:
        description: "Give the agent x402 Doctor's preflight as a tool"
        default: false
        type: boolean
      safe_fetch:
        description: "Pay the way x402-safe-fetch does (preflight first, budget cap, paid-twice guard)"
        default: false
        type: boolean
      spend_limits:
        description: "An ordinary harness without Fizzl: the task's budget and only the sellers it names (not with doctor or safe_fetch)"
        default: false
        type: boolean
      effort:
        description: "Effort: low, medium, high, xhigh or max"
        default: "high"
        type: string

permissions:
  contents: read

jobs:
  exam:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: agent-safety-bench
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm ci
      - name: Take the exam
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PROVIDER: ${{ inputs.provider }}
          MODEL: ${{ inputs.model }}
          EFFORT: ${{ inputs.effort }}
          DOCTOR: ${{ inputs.doctor && '--doctor' || '' }}
          SAFE_FETCH: ${{ inputs.safe_fetch && '--safe-fetch' || '' }}
          SPEND_LIMITS: ${{ inputs.spend_limits && '--spend-limits' || '' }}
        run: node bin/exam-agent.js --provider "$PROVIDER" --model "$MODEL" --effort "$EFFORT" $DOCTOR $SAFE_FETCH $SPEND_LIMITS | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exam-agent-log
          path: agent-safety-bench/results/exam-*.jsonl
          if-no-files-found: ignore
