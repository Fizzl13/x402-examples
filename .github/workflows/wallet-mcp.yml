# presign-guard-wallet-mcp: offline tests on every change, and an npm publish started
# by hand. Publishing uses npm trusted publishing (GitHub OIDC, provenance):
# no token or secret. The very first version is published once by hand
# (npm publish from a terminal, with 2FA), because trusted publishing can only
# be configured on npmjs.com for a package that exists; then configure this
# repository and workflow (wallet-mcp.yml) as its trusted publisher.
name: wallet-mcp

on:
  push:
    branches: [main]
    paths: ["wallet-mcp/**", ".github/workflows/wallet-mcp.yml"]
  pull_request:
    paths: ["wallet-mcp/**", ".github/workflows/wallet-mcp.yml"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the version in wallet-mcp/package.json to npm"
        type: boolean
        default: false
      registry:
        description: "List the version in wallet-mcp/server.json in the official MCP registry (after it is on npm)"
        type: boolean
        default: false
      bundle:
        description: "Attach the Claude Desktop bundle (.mcpb) to a GitHub release for the version in wallet-mcp/manifest.json"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wallet-mcp
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run

  # The Claude Desktop bundle: the server with its dependencies and manifest.json, packed as one .mcpb file that
  # installs with a double click (Claude Desktop brings its own Node.js). Built on every change; attached to the
  # GitHub release wallet-mcp-v<version> when started by hand with "bundle". wallet.fizzl.eu/download/claude-desktop
  # points at the version the dashboard pins. Not marked latest: other packages release here too.
  bundle:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: wallet-mcp
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Versions match
        run: |
          node -e "const p=require('./package.json'),m=require('./manifest.json'),s=require('./server.json');if(p.version!==m.version||p.version!==s.version)throw new Error('package.json '+p.version+', manifest.json '+m.version+', server.json '+s.version)"
      - run: npm ci --omit=dev
      - run: npx -y @anthropic-ai/mcpb@2.1.2 validate manifest.json
      - run: npx -y @anthropic-ai/mcpb@2.1.2 pack . fizzl-wallet.mcpb
      - uses: actions/upload-artifact@v4
        with:
          name: fizzl-wallet-mcpb
          path: wallet-mcp/fizzl-wallet.mcpb
      - name: Attach to a GitHub release
        if: github.event_name == 'workflow_dispatch' && inputs.bundle && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./manifest.json').version"); TAG="wallet-mcp-v$V"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" fizzl-wallet.mcpb --clobber
          else
            gh release create "$TAG" fizzl-wallet.mcpb --title "Fizzl Agent Wallet $V for Claude Desktop" --notes "The Fizzl Agent Wallet (presign-guard-wallet-mcp $V) for Claude Desktop. Download fizzl-wallet.mcpb and open it: Claude Desktop installs it. Then ask Claude \"what is my wallet status?\" and enter the code it gives you at wallet.fizzl.eu. No keys to copy. Docs: https://github.com/Fizzl13/x402-examples/tree/main/wallet-mcp" --latest=false
          fi

  publish:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: wallet-mcp
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, registry-url: "https://registry.npmjs.org" }
      - run: npm install -g npm@latest # trusted publishing needs npm 11.5 or newer
      - run: npm ci
      # A version that is already on npm can't be published again: skip it instead of failing,
      # so "publish + registry" can always be run with both boxes ticked.
      - name: Already on npm?
        id: exists
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "presign-guard-wallet-mcp@$V" version >/dev/null 2>&1; then echo "Version $V is already on npm: nothing to publish."; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - if: steps.exists.outputs.skip != '1'
        run: npm publish --provenance --access public

  # Once the version is on npm: list it in the official MCP registry
  # (io.github.Fizzl13/* via GitHub OIDC, no secrets). The registry checks that
  # the npm package's "mcpName" matches server.json's name.
  mcp-registry:
    needs: [test, publish]
    if: always() && needs.test.result == 'success' && needs.publish.result != 'failure' && github.event_name == 'workflow_dispatch' && inputs.registry && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: wallet-mcp
    steps:
      - uses: actions/checkout@v5
      - name: Install mcp-publisher
        run: curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      # npm takes a few minutes to show a new version; the registry checks npm, so wait for it.
      - name: Wait for the version on npm
        run: |
          V=$(node -p "require('./package.json').version")
          for i in $(seq 1 30); do
            if curl -fsS "https://registry.npmjs.org/presign-guard-wallet-mcp/$V" >/dev/null; then echo "$V is on npm"; exit 0; fi
            echo "waiting for $V on npm…"; sleep 10
          done
          echo "::error::$V is not on npm after 5 minutes"; exit 1
      - name: Already in the registry?
        id: listed
        run: |
          V=$(node -p "require('./server.json').version"); N=$(node -p "require('./server.json').name")
          if curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=$N" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.exit(JSON.parse(s).servers.some(x=>x.server.name===process.argv[1]&&x.server.version===process.argv[2])?0:1))" "$N" "$V"; then echo "$N $V is already listed."; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - if: steps.listed.outputs.skip != '1'
        run: ./mcp-publisher login github-oidc
      - if: steps.listed.outputs.skip != '1'
        run: ./mcp-publisher publish
