# n8n-nodes-fizzl: offline tests on every change, and an npm publish started by hand.
# Publishing uses npm trusted publishing (GitHub OIDC, provenance): no token or secret. n8n's verification asks for
# provenance. The very first version is published once by hand (npm publish from a terminal, with 2FA), because
# trusted publishing can only be configured on npmjs.com for a package that exists; then configure this repository
# and workflow (n8n-fizzl.yml) as its trusted publisher.
name: n8n-fizzl

on:
  push:
    branches: [main]
    paths: ["n8n-fizzl/**", ".github/workflows/n8n-fizzl.yml"]
  pull_request:
    paths: ["n8n-fizzl/**", ".github/workflows/n8n-fizzl.yml"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the version in n8n-fizzl/package.json to npm"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: n8n-fizzl
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run

  publish:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: n8n-fizzl
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, registry-url: "https://registry.npmjs.org" }
      - run: npm install -g npm@latest # trusted publishing needs npm 11.5 or newer
      - run: npm ci
      - run: npm publish --provenance --access public
