# x402-safe-fetch: offline tests on every change, and an npm publish started
# by hand. Publishing uses npm's trusted publishing (GitHub OIDC, provenance)
# once it is set up for the package on npmjs.com; until then an NPM_TOKEN
# repository secret (an npm "granular access token" with publish rights for
# this package only) is used for the first publish.
name: safe-fetch

on:
  push:
    branches: [main]
    paths: ["safe-fetch/**", ".github/workflows/safe-fetch.yml"]
  pull_request:
    paths: ["safe-fetch/**", ".github/workflows/safe-fetch.yml"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the version in safe-fetch/package.json to npm"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: safe-fetch
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test
      - run: npm pack --dry-run

  publish:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: safe-fetch
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, registry-url: "https://registry.npmjs.org" }
      - run: npm install -g npm@latest # trusted publishing needs npm 11.5 or newer
      - run: npm ci
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
