# Fizzl for PayBox: PayBox's own checks on every change (type-check, two identical builds, MCP conformance), and the
# built dist/plugin.mjs as a download (Actions → paybox-plugin → the run → Artifacts) to upload in the PayBox
# developer portal. The toolchain is the starter's: Node.js 24.21.0 and pnpm 11.11.0.
name: paybox-plugin

on:
  push:
    branches: [main]
    paths: ["paybox-plugin/**", ".github/workflows/paybox-plugin.yml"]
  pull_request:
    paths: ["paybox-plugin/**", ".github/workflows/paybox-plugin.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paybox-plugin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24.21.0 }
      - run: npm install -g pnpm@11.11.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --silent test
      - uses: actions/upload-artifact@v4
        with:
          name: fizzl-paybox-plugin
          path: paybox-plugin/dist/plugin.mjs
          if-no-files-found: error
