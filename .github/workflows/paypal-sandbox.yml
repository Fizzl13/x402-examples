# fizzl-paypal-guard against the PayPal sandbox (test money only): card payments into the sandbox shop, then
# the guarded Agent Toolkit refunds the right customer and stops the wrong one. Uses the repository secrets
# PAYPAL_SANDBOX_CLIENT_ID and PAYPAL_SANDBOX_SECRET (a sandbox REST app; live keys don't belong here).
name: paypal-sandbox

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script in paypal-guard/sandbox to run"
        default: probe.mjs
  push:
    branches: [claude/x402-agents-solana-payments-nceg9b]
    paths: ["paypal-guard/sandbox/**", ".github/workflows/paypal-sandbox.yml"]

permissions:
  contents: read

concurrency:
  group: paypal-sandbox
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: paypal-guard
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm ci
      - run: npm install --no-save @paypal/agent-toolkit@1.11.0
      - name: Run
        env:
          PAYPAL_SANDBOX_CLIENT_ID: ${{ secrets.PAYPAL_SANDBOX_CLIENT_ID }}
          PAYPAL_SANDBOX_SECRET: ${{ secrets.PAYPAL_SANDBOX_SECRET }}
          SCRIPT: ${{ inputs.script || 'probe.mjs' }}
        run: |
          case "$SCRIPT" in *[!A-Za-z0-9._-]*) echo "bad script name"; exit 1;; esac
          node "sandbox/$SCRIPT"
