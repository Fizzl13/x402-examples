# fizzl-paypal-guard against the PayPal sandbox (test money only): card payments into the sandbox shop, then
# the guarded Agent Toolkit refunds the right customer and stops the wrong one (sandbox/probe.mjs), and the
# demo shop's support agent answers six customer emails, one on a payment under a chargeback (demo/run.mjs): Claude ("careful") and a scripted
# agent that believes every email ("fooled"), and the guarded MCP server is used the way an MCP client uses it
# (paypal-guard-mcp/test/sandbox.mjs). Uses the repository secrets PAYPAL_SANDBOX_CLIENT_ID and
# PAYPAL_SANDBOX_SECRET (a sandbox REST app; live keys don't belong here), ANTHROPIC_API_KEY for Claude, and
# WALLET_SERVER_URL/KEY when approvals go to the owner's Telegram through the Fizzl wallet. Every Monday until the
# PayPal AI Hackathon's judging ends (15 Dec 2026) it also runs on a schedule, with the free agent only, and checks
# that the live demo (fizzl-paypal-demo.onrender.com) answers in sandbox mode with Claude on.
name: paypal-sandbox

on:
  workflow_dispatch:
    inputs:
      script:
        description: "What to run: demo (the shop's inbox), probe (direct guard checks), mcp (the MCP server), dispute (what PayPal does with a chargeback), or several"
        default: demo
      mode:
        description: "Demo agent: careful (Claude), fooled (believes every email, scripted), or both"
        default: careful fooled
      approver:
        description: "Who answers over-limit actions: scripted, or wallet (your Fizzl wallet: Telegram + dashboard, 10 minutes to answer)"
        default: scripted
  schedule:
    - cron: "23 6 * * 1"
  push:
    branches: [claude/x402-agents-solana-payments-nceg9b]
    paths: ["paypal-guard/sandbox/**", "paypal-guard/demo/**", "paypal-guard/src/**", "paypal-guard-mcp/**", ".github/workflows/paypal-sandbox.yml"]

permissions:
  contents: read

concurrency:
  group: paypal-sandbox
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: paypal-guard
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm ci
      - run: npm install --no-save @paypal/agent-toolkit@1.11.0 @anthropic-ai/sdk@0.137.0
      - run: npm ci
        working-directory: paypal-guard/demo
      - run: npm ci
        working-directory: paypal-guard-mcp
      - name: Live demo answers
        if: github.event_name != 'push'
        working-directory: .
        run: |
          for i in 1 2 3; do
            if c=$(curl -fsS --max-time 60 https://fizzl-paypal-demo.onrender.com/api/config); then break; fi
            c=""; sleep 30
          done
          echo "${c:-no answer}"
          echo "$c" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{let c;try{c=JSON.parse(s)}catch{console.log("::error::the live demo did not answer /api/config");process.exit(1)}if(c.paypal!=="sandbox"){console.log(`::error::the live demo runs with PayPal ${c.paypal}, not the sandbox (Render env PAYPAL_SANDBOX_CLIENT_ID/SECRET)`);process.exit(1)}if(!c.claude){console.log("::error::the live demo has no Claude agent (Render env ANTHROPIC_API_KEY and DEMO_CODE)");process.exit(1)}console.log("live demo ok")})'
      - name: Run
        env:
          PAYPAL_SANDBOX_CLIENT_ID: ${{ secrets.PAYPAL_SANDBOX_CLIENT_ID }}
          PAYPAL_SANDBOX_SECRET: ${{ secrets.PAYPAL_SANDBOX_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # A push or the Monday run uses the free agent only; Claude runs when started by hand (it costs model usage).
          MODES: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'fooled' || inputs.mode || 'careful fooled' }}
          APPROVER: ${{ inputs.approver || 'scripted' }}
          WALLET_SERVER_URL: ${{ secrets.WALLET_SERVER_URL }}
          WALLET_SERVER_KEY: ${{ secrets.WALLET_SERVER_KEY }}
          WHAT: ${{ inputs.script || 'probe demo mcp' }}
        run: |
          for w in $WHAT; do
            case "$w" in
              probe) echo "::group::probe"; node sandbox/probe.mjs; echo "::endgroup::" ;;
              mcp) echo "::group::mcp"; (cd ../paypal-guard-mcp && node test/sandbox.mjs); echo "::endgroup::" ;;
              dispute) echo "::group::dispute probe"; node sandbox/dispute-probe.mjs; echo "::endgroup::" ;;
              demo) for m in $MODES; do case "$m" in careful|fooled) ;; *) echo "bad mode"; exit 1;; esac; echo "::group::demo ($m)"; (cd demo && AGENT_MODE="$m" node run.mjs); echo "::endgroup::"; done ;;
              *) echo "bad choice: $w"; exit 1 ;;
            esac
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paypal-sandbox-run
          path: paypal-guard/demo/out/
          if-no-files-found: ignore
