# Dependency updates (Dependabot). Security fixes come as their own PRs as soon as an advisory is out (needs
# "Dependabot security updates" on in the repository's Code security settings). Version updates come once a week as
# one grouped PR, minor and patch only; major versions are left for a person to decide.
version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/agent-allowance"
      - "/agent-safety-bench"
      - "/agentkit-guard"
      - "/ai-sdk-guard"
      - "/concordium-facilitator"
      - "/crowding-check"
      - "/fizzl-langchain"
      - "/guard-wallet"
      - "/p0-guard"
      - "/payer-screen"
      - "/paypal-guard-mcp"
      - "/paypal-guard"
      - "/paypal-guard/demo"
      - "/privy-sanctions-sync"
      - "/safe-fetch"
      - "/safe-pay"
      - "/solana-agent-kit-guard"
      - "/subscription"
      - "/token-check"
      - "/wallet-mcp"
      - "/wallet-server"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Prerelease line (10.0.0-alpha -> -beta): moved by hand, with the Algorand payment code that uses it.
      - dependency-name: "@algorandfoundation/algokit-utils"
      # The contracts pin `pragma solidity 0.8.26` (deployed bytecode must match): the compiler stays on that version.
      - dependency-name: "solc"
    commit-message:
      prefix: "deps"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

