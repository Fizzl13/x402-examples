[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fizzl"
version = "0.2.0"
description = "Safety checks for AI agents that pay: check a transaction or signature before signing, a token before buying, a wallet's approvals, and an x402 endpoint before paying it (presign-guard, x402 Doctor)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = ["requests>=2.28"]
keywords = ["x402", "ai-agents", "agents", "langchain", "wallet", "security", "presign", "token-check", "honeypot", "approvals", "usdc", "base", "solana", "mcp"]
classifiers = ["Programming Language :: Python :: 3", "Intended Audience :: Developers", "Topic :: Security"]

[project.optional-dependencies]
langchain = ["langchain-core>=0.3", "pydantic>=2"]
x402 = ["x402[requests]>=2.0"]

[project.urls]
Homepage = "https://github.com/Fizzl13/x402-examples/tree/main/fizzl-py"
Repository = "https://github.com/Fizzl13/x402-examples"

[tool.hatch.build.targets.wheel]
packages = ["src/fizzl"]
